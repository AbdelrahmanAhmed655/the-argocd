# Argo CD Application: deploys the "guestbook" example app from the official
# argocd-example-apps repo and keeps it in sync automatically.
#
# To deploy your own app, change spec.source (repoURL / targetRevision / path)
# and spec.destination.namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ngnix
  # Application objects must live in the namespace Argo CD is installed in.
  namespace: argocd
  # Deleting this Application also deletes the resources it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AbdelrahmanAhmed655/the-argocd.git
    targetRevision: main
    path: base

  destination:
    # The cluster Argo CD itself runs in.
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true    # delete resources that were removed from Git
      selfHeal: true # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true

